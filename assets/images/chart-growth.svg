<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <!-- Developer: Rituraj Shukla -->
  <defs>
    <linearGradient id="chartLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#862519" />
      <stop offset="50%" stop-color="#A82E1F" />
      <stop offset="100%" stop-color="#E85D4E" />
    </linearGradient>
    <linearGradient id="areaFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A82E1F" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#A82E1F" stop-opacity="0.0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="600" height="380" rx="16" fill="#111111" />
  
  <!-- Header Bar -->
  <rect x="0" y="0" width="600" height="52" rx="16" fill="#1A1A1A" />
  <circle cx="28" cy="26" r="5" fill="#E85D4E" />
  <circle cx="44" cy="26" r="5" fill="#555555" />
  <circle cx="60" cy="26" r="5" fill="#333333" />
  <text x="80" y="31" font-family="'Poppins', sans-serif" font-size="12" font-weight="600" fill="#FFFFFF" letter-spacing="1">CREATIVE TESTING VELOCITY &amp; ROAS SCALING</text>
  <rect x="490" y="14" width="86" height="24" rx="12" fill="#A82E1F" />
  <text x="502" y="30" font-family="'Poppins', sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">+218% ROAS</text>

  <!-- Grid lines -->
  <line x1="60" y1="80" x2="550" y2="80" stroke="#222222" stroke-dasharray="4" />
  <line x1="60" y1="140" x2="550" y2="140" stroke="#222222" stroke-dasharray="4" />
  <line x1="60" y1="200" x2="550" y2="200" stroke="#222222" stroke-dasharray="4" />
  <line x1="60" y1="260" x2="550" y2="260" stroke="#222222" stroke-dasharray="4" />
  <line x1="60" y1="320" x2="550" y2="320" stroke="#333333" />

  <!-- Y Labels -->
  <text x="35" y="84" font-family="'Poppins', sans-serif" font-size="11" fill="#777777">4.0x</text>
  <text x="35" y="144" font-family="'Poppins', sans-serif" font-size="11" fill="#777777">3.0x</text>
  <text x="35" y="204" font-family="'Poppins', sans-serif" font-size="11" fill="#777777">2.0x</text>
  <text x="35" y="264" font-family="'Poppins', sans-serif" font-size="11" fill="#777777">1.0x</text>

  <!-- Area under curve -->
  <path d="M 70 290 Q 140 280, 200 240 T 330 180 T 450 110 T 540 70 L 540 320 L 70 320 Z" fill="url(#areaFill)" />

  <!-- The Winning ROAS Curve -->
  <path d="M 70 290 Q 140 280, 200 240 T 330 180 T 450 110 T 540 70" fill="none" stroke="url(#chartLineGrad)" stroke-width="4" filter="url(#glow)" />

  <!-- Traditional Flatline comparison curve -->
  <path d="M 70 295 L 540 280" fill="none" stroke="#555555" stroke-dasharray="6" stroke-width="2" />
  <text x="380" y="272" font-family="'Poppins', sans-serif" font-size="10" fill="#888888">Traditional Agency Flatline</text>

  <!-- Data point badges -->
  <!-- Week 1 -->
  <circle cx="70" cy="290" r="5" fill="#FFFFFF" stroke="#A82E1F" stroke-width="3" />
  <!-- Week 2 -->
  <circle cx="200" cy="240" r="5" fill="#FFFFFF" stroke="#A82E1F" stroke-width="3" />
  <!-- Week 3 (Hook Sprint) -->
  <circle cx="330" cy="180" r="5" fill="#FFFFFF" stroke="#A82E1F" stroke-width="3" />
  <!-- Week 4 (Scaling Winners) -->
  <circle cx="450" cy="110" r="6" fill="#FFFFFF" stroke="#E85D4E" stroke-width="3" />
  <rect x="390" y="80" width="120" height="22" rx="4" fill="#A82E1F" />
  <text x="396" y="95" font-family="'Poppins', sans-serif" font-size="10" font-weight="600" fill="#FFFFFF">Hook 3B Winner (3.4x)</text>

  <!-- Final Peak -->
  <circle cx="540" cy="70" r="7" fill="#FFFFFF" stroke="#E85D4E" stroke-width="4" />

  <!-- X Labels -->
  <text x="60" y="345" font-family="'Poppins', sans-serif" font-size="11" fill="#888888">Sprint 1: Hook Test</text>
  <text x="190" y="345" font-family="'Poppins', sans-serif" font-size="11" fill="#888888">Sprint 2: Body Iteration</text>
  <text x="340" y="345" font-family="'Poppins', sans-serif" font-size="11" fill="#888888">Sprint 3: Dynamic Cutdowns</text>
  <text x="490" y="345" font-family="'Poppins', sans-serif" font-size="11" font-weight="600" fill="#E85D4E">Scale Sprint</text>
</svg>
