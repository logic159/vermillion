<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%" preserveAspectRatio="none">
  <!-- Developer: Rituraj Shukla -->
  <!-- Diagonal Filmstrip Graphic Motif Device bleeding off-screen -->
  <defs>
    <pattern id="sprockets" width="24" height="60" patternUnits="userSpaceOnUse">
      <rect x="4" y="6" width="16" height="8" rx="2" fill="#FFFFFF" opacity="0.3" />
      <rect x="4" y="46" width="16" height="8" rx="2" fill="#FFFFFF" opacity="0.3" />
    </pattern>
    <linearGradient id="filmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A82E1F" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#862519" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#111111" stop-opacity="0.98" />
    </linearGradient>
  </defs>

  <!-- Filmstrip Ribbons -->
  <g transform="rotate(-14, 600, 200)">
    <!-- Primary Filmstrip -->
    <rect x="-300" y="140" width="1800" height="70" fill="url(#filmGrad)" rx="6" />
    <rect x="-300" y="140" width="1800" height="70" fill="url(#sprockets)" />
    
    <!-- Film cell separators -->
    <line x1="-150" y1="140" x2="-150" y2="210" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="2" />
    <line x1="50" y1="140" x2="50" y2="210" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="2" />
    <line x1="250" y1="140" x2="250" y2="210" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="2" />
    <line x1="450" y1="140" x2="450" y2="210" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="2" />
    <line x1="650" y1="140" x2="650" y2="210" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="2" />
    <line x1="850" y1="140" x2="850" y2="210" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="2" />
    <line x1="1050" y1="140" x2="1050" y2="210" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="2" />
    <line x1="1250" y1="140" x2="1250" y2="210" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="2" />

    <!-- Secondary offset strip for visual rhythm -->
    <rect x="-200" y="230" width="1600" height="34" fill="#A82E1F" opacity="0.25" rx="4" />
  </g>
</svg>
